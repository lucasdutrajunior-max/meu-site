<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>CrazyGames</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        header {
            background-color: red;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        article {
            display: block;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }

        article img {
            width: 90%;
            height: 350px;
            object-fit: contain;
            display: block;
            margin: 0 auto 20px auto;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        h2 {
            color: #333;
        }

        p {
            font-size: 17px;
            line-height: 1.5;
        }

        button {
            font-size: 18px;
            padding: 8px 15px;
            margin-right: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #eee;
        }

        button:hover {
            background-color: #ddd;
        }
